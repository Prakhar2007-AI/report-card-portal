<!DOCTYPE html>
<html>
<head>
    <title>Student Report Card Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>Student Report Card Generator</h1>

        <p id="message"></p>

        <div class="box">
            <h2 id="formTitle">Enter Student Details</h2>
            <form id="studentForm">
                <input type="hidden" name="id">

                <label>Student Name</label>
                <input type="text" name="name" required>

                <label>Roll Number</label>
                <input type="number" name="roll_no" min="0" step="1" required>

                <label>Class</label>
                <input type="text" name="class_name" required>

                <h3>Subjects and Marks (Out of 100)</h3>

                <div class="subject">
                    <input type="text" name="subject1_name" value="Digital Logic Design" required>
                    <input type="number" name="subject1" min="0" max="100" step="0.01" placeholder="Marks" required>
                </div>
                <div class="subject">
                    <input type="text" name="subject2_name" value="AI Landscape and Tools" required>
                    <input type="number" name="subject2" min="0" max="100" step="0.01" placeholder="Marks" required>
                </div>
                <div class="subject">
                    <input type="text" name="subject3_name" value="Software Design and Development" required>
                    <input type="number" name="subject3" min="0" max="100" step="0.01" placeholder="Marks" required>
                </div>
                <div class="subject">
                    <input type="text" name="subject4_name" value="Linear Algebra" required>
                    <input type="number" name="subject4" min="0" max="100" step="0.01" placeholder="Marks" required>
                </div>
                <div class="subject">
                    <input type="text" name="subject5_name" value="Problem Solving and Python Programming" required>
                    <input type="number" name="subject5" min="0" max="100" step="0.01" placeholder="Marks" required>
                </div>

                <button type="submit" id="saveButton">Generate Report Card</button>
                <button type="button" id="cancelButton" hidden>Cancel</button>
            </form>
        </div>

        <div class="box">
            <h2>Student Records</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th><th>Name</th><th>Roll No.</th><th>Class</th>
                            <th>Total</th><th>Percentage</th><th>Grade</th><th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentList">
                        <tr><td colspan="8">Loading records...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <p class="footer">Made using Python, HTML, CSS and SQLite</p>
    </div>

    <script>
        const form = document.getElementById("studentForm");
        const list = document.getElementById("studentList");

        function showMessage(text) {
            document.getElementById("message").textContent = text;
        }

        async function loadStudents() {
            const response = await fetch("/students");
            const students = await response.json();
            list.innerHTML = "";

            if (students.length === 0) {
                list.innerHTML = '<tr><td colspan="8">No records found.</td></tr>';
                return;
            }

            students.forEach(function(student) {
                const row = document.createElement("tr");
                [student.id, student.name, student.roll_no, student.class_name,
                 student.total, student.percentage + "%", student.grade].forEach(function(value) {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                });

                const actions = document.createElement("td");
                const view = document.createElement("a");
                view.href = "/report?id=" + student.id;
                view.textContent = "View";
                actions.appendChild(view);

                const edit = document.createElement("button");
                edit.textContent = "Edit";
                edit.onclick = function() { editStudent(student.id); };
                actions.appendChild(edit);

                const remove = document.createElement("button");
                remove.textContent = "Delete";
                remove.onclick = function() { deleteStudent(student.id); };
                actions.appendChild(remove);

                row.appendChild(actions);
                list.appendChild(row);
            });
        }

        async function editStudent(id) {
            const response = await fetch("/student?id=" + id);
            const result = await response.json();

            if (result.success) {
                Object.keys(result.data).forEach(function(key) {
                    if (form.elements[key]) form.elements[key].value = result.data[key];
                });
                document.getElementById("formTitle").textContent = "Edit Student Details";
                document.getElementById("saveButton").textContent = "Save Changes";
                document.getElementById("cancelButton").hidden = false;
                window.scrollTo(0, 0);
            } else {
                showMessage(result.message);
            }
        }

        async function deleteStudent(id) {
            if (!confirm("Do you want to delete this student record?")) return;

            const response = await fetch("/delete", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({id: id})
            });
            const result = await response.json();
            showMessage(result.message);
            if (result.success) loadStudents();
        }

        function resetForm() {
            form.reset();
            form.elements.id.value = "";
            document.getElementById("formTitle").textContent = "Enter Student Details";
            document.getElementById("saveButton").textContent = "Generate Report Card";
            document.getElementById("cancelButton").hidden = true;
        }

        document.getElementById("cancelButton").onclick = resetForm;

        form.onsubmit = async function(event) {
            event.preventDefault();
            const data = Object.fromEntries(new FormData(form).entries());
            const editing = data.id !== "";
            const response = await fetch(editing ? "/update" : "/add", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(data)
            });
            const result = await response.json();
            showMessage(result.message);

            if (result.success) {
                resetForm();
                loadStudents();
            }
        };

        loadStudents();
    </script>
</body>
</html>
